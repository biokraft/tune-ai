<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Style B · Night Console</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07040D}
</style>
</helmet>
<div style="width: 1440px; height: 1820px; display: flex; flex-direction: column; gap: 20px; background: #07040D; font-family: Manrope, system-ui, sans-serif; color: #EEE9F8">
  <dc-import name="Main" look="{{look}}" chat="open" hint-size="1440px,900px"></dc-import>
  <dc-import name="Dock303" look="{{look}}" hint-size="1440px,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"look":{"editor":"enum","options":["a","b","c"],"default":"b"},"$preview":{"width":1440,"height":1820}}'>
class Component extends DCLogic {
  renderVals() {
    return { look: this.props.look ?? 'b' };
  }
}
</script>
</body>
</html>
