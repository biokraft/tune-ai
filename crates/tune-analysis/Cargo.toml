[package]
name = "tune-analysis"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
hound = "3.5"
symphonia = { version = "=0.5.5", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "pcm"] }
ebur128 = "=0.1.10"
thiserror = "2"
realfft = "=3.5.0"
serde_json = { version = "1", features = ["preserve_order"] }
png = "=0.18.1"
font8x8 = "=0.3.1"

[dev-dependencies]
tempfile = "3"
