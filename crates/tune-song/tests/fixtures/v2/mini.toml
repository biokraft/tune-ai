# Shared fixture: tune-song, tune-engine and tune-cli tests all read this file.

[song]
version = 2
name = "mini"
bpm = 120
seed = 7

[tracks.kick]
instrument = "kick"
gain_db = -3
play = [
  { at = 1, clip = "k4", bars = 2 },
  { at = 3, clip = "k4", bars = 2 },
]

[tracks.acid]
instrument = "acid303"
params = { "acid303.cutoff" = 500, "acid303.resonance" = 70, "acid303.env_mod" = 50, "acid303.decay" = 400, "acid303.accent" = 55 }
fx = [{ type = "distortion", mode = "soft", params = { "dist.drive" = 12 } }]
play = [{ at = 3, clip = "a1", bars = 2 }]

[tracks.hat]
instrument = "hat_closed"
gain_db = -10
pan = 0.3
play = [
  { at = 1, clip = "h", bars = 2 },
  { at = 3, clip = "h", bars = 2 },
]

[clips.k4]
kind = "drum"
steps = "x...x...x...X..."

[clips.a1]
kind = "acid"
steps = "C2 C2! C3~ C2 . D#2 C2~ G2!"

[clips.h]
kind = "drum"
steps = "..x...x...x...x."

[[sections]]
name = "a"
bars = 2

[[sections]]
name = "b"
bars = 2

[[automation]]
param = "acid.acid303.cutoff"
at = 3
bars = 2
points = [[0, 0.1], [2, 0.8]]
