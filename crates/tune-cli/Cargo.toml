[package]
name = "tune-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tune"
path = "src/main.rs"

[lints]
workspace = true

[lib]
name = "tune_cli"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
cpal = "0.18.2"
ctrlc = "3.5.2"
hound = "3.5"
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tune-dsp = { path = "../tune-dsp" }
tune-engine = { path = "../tune-engine" }
tune-song = { path = "../tune-song" }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
